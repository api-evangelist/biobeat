name: Biobeat
kind: company
description: Biobeat Technologies is an Israeli med-tech company whose remote patient
  monitoring (RPM) health-AI platform pairs a disposable short-term chest-monitor and
  a reusable long-term wrist-monitor - both using a photoplethysmography (PPG) sensor
  - to continuously track up to 13 vital signs, including FDA-cleared cuffless blood
  pressure, pulse rate, respiratory rate, blood oxygen saturation, temperature, stroke
  volume, cardiac output, and one-lead ECG (chest-monitor). Readings stream to Biobeat's
  HIPAA- and GDPR-compliant, cloud-based patient management platform, where clinicians
  view real-time data, trends, and configurable alerts. Biobeat offers programmatic
  data access and EMR/EHR integration as a paid add-on for hospitals, health systems,
  and research partners; there is no publicly documented self-serve developer API.
