  - url: https://www.prnewswire.com/news-releases/fda-clears-the-biobeat-remote-patient-monitoring-device-and-platform-for-additional-vital-signs-301511494.html
    type: Article
    note: FDA clearance for additional vital signs; confirms parameter set and platform.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket (or any documented public) protocol surface exists. Biobeat's
    public developer footprint is a partner-gated paid API add-on with no published
    reference. The apis.yml entries were kept as explicitly modeled logical
    resources (endpointsModeled: true) rather than a fabricated concrete API, and
    no AsyncAPI document was created because there is no documented server-push
    transport on any Biobeat public API to model.
